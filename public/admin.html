<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Controle - Admin Delivery</title>

  <!-- Tailwind CSS (CDN para prototipagem rápida) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Leaflet CSS & JS (Mapa interativo) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Navbar Superior -->
  <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🍔</span>
      <h1 class="text-xl font-bold">Delivery Central - Painel Administrativo</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span id="socket-status" class="inline-block w-3 h-3 bg-red-500 rounded-full"></span>
      <span id="status-text" class="text-sm text-gray-300">Desconectado</span>
    </div>
  </header>

  <!-- Layout Principal -->
  <main class="p-6 max-w-7xl mx-auto space-y-6">

    <!-- 1. Cards de Métricas -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-lg shadow border-l-4 border-yellow-500">
        <p class="text-xs uppercase font-semibold text-gray-500">Pendentes / Preparo</p>
        <h2 id="total-pendentes" class="text-3xl font-bold text-gray-800 mt-1">0</h2>
      </div>
      <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-500">
        <p class="text-xs uppercase font-semibold text-gray-500">Em Rota de Entrega</p>
        <h2 id="total-em-rota" class="text-3xl font-bold text-gray-800 mt-1">0</h2>
      </div>
      <div class="bg-white p-5 rounded-lg shadow border-l-4 border-green-500">
        <p class="text-xs uppercase font-semibold text-gray-500">Concluídos Hoje</p>
        <h2 id="total-entregues" class="text-3xl font-bold text-gray-800 mt-1">0</h2>
      </div>
      <div class="bg-white p-5 rounded-lg shadow border-l-4 border-purple-500">
        <p class="text-xs uppercase font-semibold text-gray-500">Entregadores Ativos</p>
        <h2 id="entregadores-ativos" class="text-3xl font-bold text-gray-800 mt-1">0</h2>
      </div>
    </section>

    <!-- 2. Conteúdo Principal: Tabela de Pedidos + Mapa -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Lista / Tabela de Pedidos Ativos -->
      <div class="lg:col-span-2 bg-white rounded-lg shadow p-5">
        <h2 class="text-lg font-bold text-gray-700 mb-4 flex justify-between items-center">
          <span>📋 Pedidos em Andamento</span>
          <button onclick="carregarPedidos()" class="text-sm text-blue-600 hover:underline">Atualizar</button>
        </h2>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-50 uppercase text-xs text-gray-500">
              <tr>
                <th class="p-3">ID Pedido</th>
                <th class="p-3">Valor</th>
                <th class="p-3">Pagamento</th>
                <th class="p-3">Status</th>
                <th class="p-3">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-pedidos" class="divide-y divide-gray-200">
              <!-- Inserido dinamicamente via JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Mapa de Rastreamento GPS ao Vivo -->
      <div class="bg-white rounded-lg shadow p-5 flex flex-col">
        <h2 class="text-lg font-bold text-gray-700 mb-4">📍 Rastreamento em Tempo Real</h2>
        <div id="mapa" class="w-full h-80 rounded-lg bg-gray-200"></div>
        <p class="text-xs text-gray-500 mt-2">Clique em um pedido "Em Rota" para focar no mapa.</p>
      </div>

    </section>

  </main>

  <!-- Lógica JavaScript do Painel -->
  <script>
    const socket = io();
    const API_URL = 'http://localhost:3000/api';

    // Inicialização do Mapa Leaflet
    const map = L.map('mapa').setView([-23.55052, -46.633308], 12); // Posição padrão (Ex: SP)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marcadoresEntregadores = {};

    // Conexão do Socket
    socket.on('connect', () => {
      document.getElementById('socket-status').className = 'inline-block w-3 h-3 bg-green-500 rounded-full';
      document.getElementById('status-text').innerText = 'Online';
      console.log('Painel conectado ao WebSocket!');
    });

    socket.on('disconnect', () => {
      document.getElementById('socket-status').className = 'inline-block w-3 h-3 bg-red-500 rounded-full';
      document.getElementById('status-text').innerText = 'Desconectado';
    });

    // Escuta atualizações de GPS enviadas pelos entregadores
    socket.on('atualizacao_gps_cliente', (data) => {
      const { pedidoId, lat, lng } = data;
      console.log(`GPS Atualizado no Painel - Pedido #${pedidoId}:`, lat, lng);

      // Atualiza ou cria o marcador do entregador no mapa
      if (marcadoresEntregadores[pedidoId]) {
        marcadoresEntregadores[pedidoId].setLatLng([lat, lng]);
      } else {
        marcadoresEntregadores[pedidoId] = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`<b>Pedido #${pedidoId}</b><br>Em transporte`);
      }
    });

    // Escuta alteração de status via Socket
    socket.on('status_alterado', () => {
      carregarPedidos(); // Recarrega a tabela quando algum pedido muda
    });

    // Buscar pedidos na API Backend
    async function carregarPedidos() {
      try {
        const response = await fetch(`${API_URL}/pedidos`); // Ajuste conforme sua rota de busca
        const pedidos = await response.json();
        renderizarTabela(pedidos);
      } catch (err) {
        console.error('Erro ao buscar pedidos:', err);
      }
    }

    // Renderizar linhas na tabela
    function renderizarTabela(pedidos) {
      const tbody = document.getElementById('tabela-pedidos');
      tbody.innerHTML = '';

      let countPendentes = 0;
      let countRota = 0;
      let countEntregues = 0;

      pedidos.forEach(p => {
        if (p.status === 'PENDENTE' || p.status === 'PRONTO') countPendentes++;
        if (p.status === 'EM_ROTA') countRota++;
        if (p.status === 'ENTREGUE') countEntregues++;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-3 font-medium text-gray-900">#${p.id}</td>
          <td class="p-3">R$ ${p.valor_total.toFixed(2)}</td>
          <td class="p-3">${p.metodo_pagamento}</td>
          <td class="p-3">${obterBadgeStatus(p.status)}</td>
          <td class="p-3">
            <select onchange="alterarStatus('${p.id}', this.value)" class="text-xs border rounded p-1">
              <option value="PENDENTE" ${p.status === 'PENDENTE' ? 'selected' : ''}>Pendente</option>
              <option value="PRONTO" ${p.status === 'PRONTO' ? 'selected' : ''}>Pronto</option>
              <option value="EM_ROTA" ${p.status === 'EM_ROTA' ? 'selected' : ''}>Em Rota</option>
              <option value="ENTREGUE" ${p.status === 'ENTREGUE' ? 'selected' : ''}>Entregue</option>
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Atualiza contadores
      document.getElementById('total-pendentes').innerText = countPendentes;
      document.getElementById('total-em-rota').innerText = countRota;
      document.getElementById('total-entregues').innerText = countEntregues;
    }

    function obterBadgeStatus(status) {
      const cores = {
        'PENDENTE': 'bg-yellow-100 text-yellow-800',
        'PRONTO': 'bg-blue-100 text-blue-800',
        'EM_ROTA': 'bg-purple-100 text-purple-800',
        'ENTREGUE': 'bg-green-100 text-green-800'
      };
      return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${cores[status] || 'bg-gray-100'}">${status}</span>`;
    }

    // Alterar status diretamente pelo admin
    function alterarStatus(pedidoId, novoStatus) {
      socket.emit('alterar_status_pedido', { pedidoId, novoStatus });
    }

    // Carregar dados ao abrir
    carregarPedidos();
  </script>
</body>
</html>
